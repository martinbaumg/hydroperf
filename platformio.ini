; Configuration PlatformIO — https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hydroperf

[env]
framework = arduino
monitor_speed = 115200

; ---------- ESP32 (carte esp32dev, 16 Mo de flash) ----------
[esp32]
platform = espressif32
board = esp32dev
; La carte a 16 Mo de flash : grande partition pour le programme et pour les fichiers
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
upload_port = /dev/cu.usbserial-*
upload_speed = 460800
monitor_port = /dev/cu.usbserial-*
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  bblanchon/ArduinoJson@^7

; Application HydroPerf : pio run -t upload -t monitor
[env:hydroperf]
extends = esp32
; Écran OLED 0.96" en I2C (SDA -> IO21, SCK -> IO22). Ancien écran ST7735 : remplacer par +<ecran.cpp>
build_src_filter = +<hydroperf/> +<ecran_oled.cpp>
; L'interface web est intégrée au programme
board_build.embed_files = web/index.html

; Sprint 1 (LED, vibreur, buzzer en Wi-Fi) : pio run -e sprint1 -t upload -t monitor
[env:sprint1]
extends = esp32
build_src_filter = +<main.cpp> +<ecran.cpp>

; Diagnostic de l'écran : pio run -e diag -t upload -t monitor
[env:diag]
extends = esp32
build_src_filter = +<diag/>

; ---------- Seeed XIAO nRF52840 ----------
; Diagnostic de l'écran : pio run -e diag_xiao -t upload -t monitor
[env:diag_xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
build_src_filter = +<diag/>
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
; Écran : SCL -> D8, SDA -> D10 (SPI matériel), RS/DC -> D3, RES -> D4, CS -> D5
build_flags =
  -DTFT_CS=5
  -DTFT_DC=3
  -DTFT_RST=4
  -DTFT_MOSI=10
  -DTFT_SCLK=8

; ---------- Arduino UNO ----------
; Test minimal de l'écran : pio run -e test_uno -t upload
[env:test_uno]
platform = atmelavr
board = uno
build_src_filter = +<test_uno/>
upload_port = /dev/cu.usbmodem*
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library

; Diagnostic de l'écran : pio run -e diag_uno -t upload -t monitor
[env:diag_uno]
extends = env:test_uno
build_src_filter = +<diag_uno/>

; ---------- ESP8266 (NodeMCU / Wemos D1 mini) ----------
; Diagnostic de l'écran : pio run -e diag_esp8266 -t upload -t monitor
; Écran : SCL -> D5, SDA -> D7 (SPI matériel), CS -> D8, DC -> D1, RES -> D2, VCC -> 3V3
[env:diag_esp8266]
platform = espressif8266
board = nodemcuv2
build_src_filter = +<diag_uno/>
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
build_flags =
  -DTFT_CS=15
  -DTFT_DC=5
  -DTFT_RST=4
  -DTFT_MOSI=13
  -DTFT_SCLK=14

; Test minimal de l'écran : pio run -e test_esp8266 -t upload
[env:test_esp8266]
extends = env:diag_esp8266
build_src_filter = +<test_uno/>

; Test de l'écran OLED 0.96" SSD1306 (I2C) : pio run -e test_oled -t upload -t monitor
; Écran : GND -> GND, VDD -> 3V3, SCK -> IO22, SDA -> IO21
[env:test_oled]
extends = esp32
build_src_filter = +<test_oled/>
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library

; Test de l'écran OLED sur ESP8266 : pio run -e test_oled_esp8266 -t upload -t monitor
; Écran : GND -> G, VDD -> 3V3, SCK -> D1, SDA -> D2
[env:test_oled_esp8266]
platform = espressif8266
board = nodemcuv2
build_src_filter = +<test_oled/>
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
build_flags =
  -DOLED_SDA=4
  -DOLED_SCL=5
